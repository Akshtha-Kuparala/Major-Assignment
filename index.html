<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Video Streaming Platform</title>
    <style>
        /* Custom font import */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #181818;
            color: white;
            display: flex;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #202020;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            animation: fadeIn 0.5s forwards 0.5s;
        }

        .navbar h1 {
            margin: 0;
            font-size: 20px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 60px;
            width: 200px;
            height: 100vh;
            background: #242424;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            animation: fadeIn 0.5s forwards 0.5s;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
        }

        /* Video Section */
        .video-section {
            margin-left: 220px;
            margin-top: 70px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .video-box {
            background: #303030;
            padding: 10px;
            width: 300px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .video-box:hover {
            border: 1px solid white;
            box-shadow: 0 0 10px white;
        }

        .video-box img {
            width: 100%;
            border-radius: 5px;
        }

        .video-title {
            font-size: 16px;
            margin-top: 10px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .video-section {
                margin-left: 0;
                flex-direction: column;
                align-items: center;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>StudyStream</h1>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Search</a>
            <a href="#">Courses</a>
        </div>
    </div>

    <div class="sidebar">
        <a href="#">Liked Videos</a>
        <a href="#">Downloads</a>
        <a href="#">Search</a>
        <a href="#">Courses</a>
        <a href="#">Subscriptions</a>
    </div>

    <div class="video-section">
        <div class="video-box">
            <img src="thumbnail1.jpg" alt="Video Thumbnail">
            <p class="video-title">Learning CSS Animations</p>
        </div>
        <div class="video-box">
            <img src="thumbnail2.jpg" alt="Video Thumbnail">
            <p class="video-title">Responsive Web Design</p>
        </div>
        <div class="video-box">
            <img src="thumbnail3.jpg" alt="Video Thumbnail">
            <p class="video-title">Mastering Flexbox</p>
        </div>
    </div>
</body>
</html>
